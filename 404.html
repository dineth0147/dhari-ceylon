<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Dhari Ceylon Wellness</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-deep: #0a2e26;
      --gold: #c5a059;
      --gold-dark: #a88438;
      --cream: #faf7f2;
      --text: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      max-width: 520px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(10, 46, 38, 0.08);
      border: 1px solid rgba(197, 160, 89, 0.2);
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 6px 16px rgba(10, 46, 38, 0.15);
    }
    .code {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--green-deep);
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #0a2e26;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(197, 160, 89, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="Dhari Ceylon Wellness" class="logo-img">
    <div class="code">404 Error</div>
    <h1>Sanctuary Not Found</h1>
    <p>The page you are looking for may have been moved, renamed, or is temporarily unavailable. Let us guide you back to our sanctuary.</p>
    <a href="/" class="btn">Return to Dhari Ceylon</a>
  </div>
</body>
</html>
